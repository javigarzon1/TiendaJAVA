# --- Email (para confirmaciones) ---
# Rellenar con las credenciales SMTP reales (ej. Gmail con contraseña de aplicación)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tu_email@gmail.com
spring.mail.password=tu_password_de_aplicacion
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Servidor ---
# Usa la variable de entorno PORT si existe (la asignan Render, Railway, etc.),
# y si no, usa 8080 por defecto (para cuando corres el proyecto en tu máquina).
     server.port=${PORT:8080}



# Zona horaria para que las fechas cuadren con Córdoba
spring.jackson.time-zone=Europe/Madrid
