# --- Base de datos H2 en memoria (desarrollo) ---
# Para producción, comenta esta sección y usa el bloque de PostgreSQL de abajo
spring.datasource.url=jdbc:h2:mem:citasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Muy importante con H2 + data.sql: sin esto, Spring a veces intenta cargar
# data.sql ANTES de que Hibernate haya creado las tablas, y falla con
# "Table X not found". Esto obliga a que las tablas se creen primero.
spring.jpa.defer-datasource-initialization=true

